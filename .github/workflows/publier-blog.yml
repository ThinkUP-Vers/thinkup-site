name: Publication éditoriale

# Publie les articles dont la date est arrivée, d'après editorial-calendar.json.
#
# La publication se fait DEPUIS LE DÉPÔT, jamais sur le serveur : le
# déploiement FTP écrase blog.html et sitemap.xml à chaque passage, un script
# qui les modifierait côté serveur verrait son travail effacé au push suivant.
#
# Ce workflow ne déploie plus lui-même. Il déclenche « Déploiement Hostinger »
# explicitement (workflow_dispatch), car un push effectué avec GITHUB_TOKEN ne
# déclenche pas les autres workflows — le déploiement habituel ne partirait
# donc jamais.
#
# Pourquoi déléguer plutôt que redéployer ici (18/08/2026) : ce fichier
# dupliquait tout le bloc FTP de deploy.yml. Les deux copies avaient déjà
# divergé (versions d'action différentes) et seule l'une des deux a reçu les
# garde-fous — retries, vérification de mise en ligne, alerte. Une seule
# définition du déploiement évite que la prochaine correction n'en oublie une.

on:
  schedule:
    # 05h00 UTC = 07h00 à Paris en été, 06h00 en hiver.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: publication-editoriale
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Publier les articles dus
        id: publication
        run: |
          php editorial/publish-blog.php
          if git diff --quiet; then
            echo "modifie=non" >> "$GITHUB_OUTPUT"
            echo "Aucun article à publier aujourd'hui."
          else
            echo "modifie=oui" >> "$GITHUB_OUTPUT"
            git diff --name-only | sed 's/^/  /'
          fi

      - name: Committer la publication
        if: steps.publication.outputs.modifie == 'oui'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(blog): publication automatique du $(date +%d/%m/%Y)"
          git push

      # Le déploiement — retries, vérification de mise en ligne et alerte —
      # est défini une seule fois, dans deploy.yml.
      - name: Déclencher le déploiement
        if: steps.publication.outputs.modifie == 'oui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh workflow run deploy.yml --ref main; then
            echo "::error::Le déploiement n'a pas pu être déclenché. Les articles sont" \
                 "publiés dans le dépôt mais PAS en ligne. Lancer à la main :" \
                 "Actions → Déploiement Hostinger → Run workflow."
            exit 1
          fi
          echo "Déploiement déclenché. Son propre run vérifie la mise en ligne."
